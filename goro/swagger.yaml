openapi: 3.0.3
info:
  title: Goro Public API
  version: "1.0.0"
  description: |
    OpenAPI specification for API-based use of Goro.

    Scope:
    - Includes endpoints exposed by `internal/api/server.go`.
    - Excludes admin-console-only endpoints under `/admin/api/*`.
    - Includes HLS/DASH segment routes as reference-only path entries.
servers:
  - url: http://localhost
    description: Nginx entrypoint (default)
tags:
  - name: Health
  - name: Videos
  - name: Playback
  - name: StreamingAssetsReference
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /videos:
    post:
      tags: [Videos]
      summary: Upload video
      description: Uploads an MP4 file and enqueues a processing job.
      operationId: uploadVideo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: MP4 file (`.mp4`)
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVideoResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Videos]
      summary: List videos
      operationId: listVideos
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema: { type: string }
          description: Filter by original filename (contains match)
        - in: query
          name: status
          schema:
            type: string
            enum: [queued, processing, ready, failed]
        - in: query
          name: visibility
          schema:
            type: string
            enum: [public, private]
        - in: query
          name: codec
          schema: { type: string }
          description: Filter by video codec (contains match)
        - in: query
          name: duration_min
          schema: { type: number, format: double }
        - in: query
          name: duration_max
          schema: { type: number, format: double }
        - in: query
          name: width_min
          schema: { type: integer }
        - in: query
          name: width_max
          schema: { type: integer }
        - in: query
          name: height_min
          schema: { type: integer }
        - in: query
          name: height_max
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}/playlist:
    get:
      tags: [Playback]
      summary: Get HLS playlist
      description: |
        Returns an HLS playlist with secure-link signed asset URLs.
        For private videos, pass `token` issued by `POST /videos/{id}/tokens`.
      operationId: getPlaylist
      security: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - in: query
          name: profile
          schema: { type: string }
          description: HLS profile name. If omitted, server default profile is used.
        - in: query
          name: token
          schema: { type: string }
          description: Required for private videos.
      responses:
        '200':
          description: OK
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}/manifest:
    get:
      tags: [Playback]
      summary: Get DASH manifest
      description: |
        Returns a DASH manifest with secure-link signed asset URLs.
        For private videos, pass `token` issued by `POST /videos/{id}/tokens`.
      operationId: getManifest
      security: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - in: query
          name: profile
          schema: { type: string }
          description: DASH profile name. If omitted, server default profile is used.
        - in: query
          name: token
          schema: { type: string }
          description: Required for private videos.
      responses:
        '200':
          description: OK
          content:
            application/dash+xml:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}/visibility:
    put:
      tags: [Videos]
      summary: Set video visibility
      operationId: setVisibility
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVisibilityRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetVisibilityResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}/referrer-whitelist:
    put:
      tags: [Videos]
      summary: Set referrer whitelist
      operationId: setReferrerWhitelist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetReferrerWhitelistRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetReferrerWhitelistResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}/title:
    put:
      tags: [Videos]
      summary: Set video title
      operationId: setTitle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTitleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetTitleResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}/tokens:
    post:
      tags: [Videos]
      summary: Issue playback token
      description: Issues a short-lived token for private playlist/manifest access.
      operationId: issueToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}:
    delete:
      tags: [Videos]
      summary: Delete video
      operationId: deleteVideo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /videos/{id}/download:
    get:
      tags: [Videos]
      summary: Download original video
      operationId: downloadVideo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: OK
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /hls/videos/{id}/{profile}/{assetPath}:
    get:
      tags: [StreamingAssetsReference]
      summary: HLS asset endpoint (reference)
      description: |
        Reference-only path entry.
        Asset URLs are signed and embedded in playlist responses (`GET /videos/{id}/playlist`).
        Clients should normally use the returned playlist/manifest and let players fetch assets.
      operationId: getHlsAssetReference
      security: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - in: path
          name: profile
          required: true
          schema: { type: string }
        - in: path
          name: assetPath
          required: true
          schema: { type: string }
          description: Asset path under the profile directory.
      responses:
        '200':
          description: Streaming asset content
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /dash/videos/{id}/{profile}/{assetPath}:
    get:
      tags: [StreamingAssetsReference]
      summary: DASH asset endpoint (reference)
      description: |
        Reference-only path entry.
        Asset URLs are signed and embedded in manifest responses (`GET /videos/{id}/manifest`).
        Clients should normally use the returned playlist/manifest and let players fetch assets.
      operationId: getDashAssetReference
      security: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - in: path
          name: profile
          required: true
          schema: { type: string }
        - in: path
          name: assetPath
          required: true
          schema: { type: string }
          description: Asset path under the profile directory.
      responses:
        '200':
          description: Streaming asset content
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Send bearer token in Authorization header.
  parameters:
    VideoId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Public video ID.

  responses:
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    UploadVideoResponse:
      type: object
      required: [video_id]
      properties:
        video_id:
          type: string

    VideoListResponse:
      type: object
      required: [videos]
      properties:
        videos:
          type: array
          items:
            $ref: '#/components/schemas/Video'

    Video:
      type: object
      required:
        - public_id
        - original_name
        - title
        - status
        - visibility
        - referrer_whitelist
        - created_at
      properties:
        public_id:
          type: string
        original_name:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [queued, processing, ready, failed]
        visibility:
          type: string
          enum: [public, private]
        referrer_whitelist:
          type: array
          items: { type: string }
        created_at:
          type: string
        duration_sec:
          type: number
          format: double
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        video_codec:
          type: string
          nullable: true
        bitrate:
          type: integer
          format: int64
          nullable: true
        framerate:
          type: string
          nullable: true
        framerate_float:
          type: number
          format: double
          nullable: true
        container_format:
          type: string
          nullable: true
        audio_codec:
          type: string
          nullable: true
        audio_bitrate:
          type: integer
          format: int64
          nullable: true
        sample_rate:
          type: integer
          nullable: true
        channels:
          type: integer
          nullable: true
        file_size:
          type: integer
          format: int64
          nullable: true
        aspect_ratio:
          type: string
          nullable: true
        rotation:
          type: integer
          nullable: true
        has_audio:
          type: boolean
          nullable: true
        has_video:
          type: boolean
          nullable: true

    SetVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [public, private]

    SetVisibilityResponse:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [public, private]

    SetReferrerWhitelistRequest:
      type: object
      properties:
        referrer_whitelist:
          type: array
          description: Domain whitelist rules. Omit or set empty array to clear whitelist (no referer restriction).
          items: { type: string }
      additionalProperties: false

    SetReferrerWhitelistResponse:
      type: object
      required: [referrer_whitelist]
      properties:
        referrer_whitelist:
          type: array
          items: { type: string }

    SetTitleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1

    SetTitleResponse:
      type: object
      required: [title]
      properties:
        title:
          type: string

    IssueTokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
